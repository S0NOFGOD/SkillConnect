<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Find Workers | SkillConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="blue-glow" aria-hidden="true"></div>
    <div class="green-glow" aria-hidden="true"></div>

    <header class="topbar">
        <div class="topbar-inner">
            <a href="../index.html" class="logo">SKILLCONNECT</a>
            <a href="../client-authentication/index.html" class="home-link">Create Account</a>
        </div>
    </header>

    <main class="dashboard" id="findWorkersPage">
        <section class="dashboard-header">
            <div class="welcome-content">
                <h1>Available <span>Workers</span></h1>
                <p class="page-description">Find nearby workers near your location.</p>
            </div>
        </section>

        <section class="dashboard-section">
            <div class="filter-bar">
                <div class="filter-group">
                    <select id="skillFilter" aria-label="Filter workers by skill">
                        <option value="">All Skills</option>
                    </select>
                </div>

                <div class="search-group">
                    <span class="search-icon" aria-hidden="true">⌕</span>
                    <input
                        type="search"
                        id="skillSearch"
                        placeholder="Search by skill name..."
                        aria-label="Search workers by skill name"
                        autocomplete="off"
                    >
                </div>
            </div>

            <div id="workersLoading" class="workers-loading" role="status" aria-live="polite" hidden>
                <div class="loading-spinner" aria-hidden="true"></div>
                <p>Connecting…</p>
            </div>

            <div id="workersContainer" class="workers-container"></div>

            <div id="workersEmpty" class="workers-empty" hidden>
                <div class="empty-icon" aria-hidden="true">🔎</div>
                <h3>No Workers Found</h3>
                <p id="workersEmptyText">No workers found within your location.</p>
            </div>
        </section>
    </main>

    <div id="notificationOverlay" class="notification-modal" role="dialog" aria-modal="true" aria-labelledby="notificationTitle" aria-describedby="notificationText" hidden>
        <div id="notificationCard" class="notification-card">
            <div id="notificationIcon" class="notification-icon" aria-hidden="true">✓</div>
            <h2 id="notificationTitle">Notification</h2>
            <p id="notificationText"></p>
            <div class="notification-actions">
                <button type="button" id="notificationCancelButtonMobile" aria-label="Cancel or close notification">No</button>
                <button type="button" id="notificationButton">Continue</button>
            </div>
        </div>
    </div>

    <script src="../config.js"></script>
    <script src="script.js" defer></script>
</body>
</html>
