<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Completing SkillConnect Google authentication.">
<title>Google Authentication | SkillConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="redirect-page">
<section class="redirect-card">
<div class="google-icon">G</div>
<h1>Completing Sign In</h1>
<p id="statusMessage">Please wait while we securely complete your Google authentication.</p>
<div id="loadingSpinner" class="loading-spinner"></div>
<button type="button" id="returnButton" class="action-button secondary hidden">Return to Login</button>
</section>
</main>

<div id="notificationModal" class="modal" aria-hidden="true">
<div class="modal-overlay" id="notificationOverlay"></div>
<div class="modal-card">
<button type="button" id="closeNotification" class="modal-close">×</button>
<div id="notificationIcon" class="modal-icon">!</div>
<h2 id="notificationTitle">Authentication</h2>
<p id="notificationMessage"></p>
<button type="button" id="notificationButton" class="modal-button">Continue</button>
</div>
</div>

<script src="../config.js"></script>
<script src="script.js"></script>
</body>
</html>
