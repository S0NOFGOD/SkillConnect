<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="View and update your SkillConnect service.">
<title>View Service | SkillConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="green-glow" aria-hidden="true"></div>
<div class="blue-glow" aria-hidden="true"></div>

<header class="topbar">
    <div class="topbar-inner">
        <button type="button" class="back-navigation" id="backNavigation" aria-label="Go back to Worker Services">
            <span class="back-icon">←</span>
            <span class="back-text">Back</span>
        </button>
    </div>
</header>

<main class="view-service-page" id="viewServicePage" hidden>

    <section class="page-header">
        <div>
            <h1>View Service</h1>
        </div>

        <p class="page-description">
                    Keep your service you offer to clients up to date.
                </p>
    </section>

    <section class="service-form-section">
        <form id="serviceForm" class="service-form" novalidate>

            <!-- Admin approval information -->
            <div id="adminStatusContainer" class="admin-status-container status-in-review">
                <h2 id="adminApproval">In Review</h2>
                <p id="adminResponse">Your service is awaiting admin review.</p>
            </div>

            <div class="form-group">
                <label for="skill">Skill</label>
                <select id="skill" name="skill" required>
                    <option value="" selected disabled>Select your skill</option>
                </select>
            </div>

            <div class="form-group">
                <label for="experience">Experience</label>
                <select id="experience" name="experience" required>
                    <option value="" selected disabled>Select your experience</option>
                    <option value="Less than 1 year">Less than 1 year</option>
                    <option value="1 year">1 year</option>
                    <option value="2 years">2 years</option>
                    <option value="3 years">3 years</option>
                    <option value="4 years">4 years</option>
                    <option value="5 years+">5 years+</option>
                </select>
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label for="description">Description</label>
                    <span id="descriptionWordCount">0 / 150 words</span>
                </div>
                <textarea
                    id="description"
                    name="description"
                    rows="7"
                    placeholder="Describe the service you provide..."
                    required
                ></textarea>
            </div>

            <div class="form-group">
                <div>
                    <label for="portfolioPhoto1">Portfolio</label>
                </div>

                <div class="portfolio-grid">

                    <div class="portfolio-upload-card">
                        <label for="portfolioPhoto1">
                            <div id="portfolioPreview1" class="portfolio-preview">
                                <span class="portfolio-placeholder">+</span>
                                <span class="portfolio-add-text">Add Image</span>
                            </div>
                            <input type="file" id="portfolioPhoto1" name="portfolioPhotos" accept="image/jpeg,image/png,image/webp">
                        </label>
                    </div>

                    <div class="portfolio-upload-card">
                        <label for="portfolioPhoto2">
                            <div id="portfolioPreview2" class="portfolio-preview">
                                <span class="portfolio-placeholder">+</span>
                                <span class="portfolio-add-text">Add Image</span>
                            </div>
                            <input type="file" id="portfolioPhoto2" name="portfolioPhotos" accept="image/jpeg,image/png,image/webp">
                        </label>
                    </div>

                    <div class="portfolio-upload-card">
                        <label for="portfolioPhoto3">
                            <div id="portfolioPreview3" class="portfolio-preview">
                                <span class="portfolio-placeholder">+</span>
                                <span class="portfolio-add-text">Add Image</span>
                            </div>
                            <input type="file" id="portfolioPhoto3" name="portfolioPhotos" accept="image/jpeg,image/png,image/webp">
                        </label>
                    </div>

                </div>
            </div>

            <div class="form-actions">
                <button type="button" id="deleteServiceBtn" class="delete-service-button">
                    <span class="delete-button-text">Delete Service</span>
                    <span class="delete-button-loader" hidden></span>
                </button>

                <button type="submit" id="updateServiceBtn" class="update-service-button">
                    <span class="update-button-text">Update Service</span>
                    <span class="update-button-loader" hidden></span>
                </button>
            </div>

        </form>
    </section>
</main>

<!-- Notification and confirmation modal -->
<div
    id="notificationOverlay"
    class="notification-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="notificationTitle"
    aria-describedby="notificationText"
    hidden
>
    <div id="notificationCard" class="notification-card">

        <button
            type="button"
            id="notificationCancelButton"
            class="notification-close-button"
            aria-label="Close notification"
        >×</button>

        <div id="notificationIcon" class="notification-icon">!</div>

        <h2 id="notificationTitle">Notification</h2>
        <p id="notificationText">Something happened.</p>

        <div class="notification-actions" id="notificationActions">
            <button type="button" id="notificationButton">Continue</button>
        </div>

    </div>
</div>

<script src="../config.js"></script>
<script src="script.js" defer></script>

</body>
</html>
