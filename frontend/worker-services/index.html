<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
         BASIC DOCUMENT CONFIGURATION
    ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        View Services | SkillConnect
    </title>


    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         PAGE STYLES
    ====================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =====================================================
         BACKGROUND EFFECTS
    ====================================================== -->

    <div
        class="green-glow"
        aria-hidden="true"
    ></div>

    <div
        class="blue-glow"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         TOP NAVIGATION BAR
    ====================================================== -->

    <header class="topbar">

        <div class="topbar-inner">

            <!-- =================================================
                 SKILLCONNECT LOGO
            ================================================== -->

            <a
                href="../worker-dashboard/index.html"
                class="logo"
            >
                SkillConnect
            </a>


            <!-- =================================================
                 MOBILE MENU BUTTON
            ================================================== -->

            <button
                type="button"
                id="menuBtn"
                class="menu-btn"
                aria-label="Open navigation menu"
                aria-controls="sidebar"
                aria-expanded="false"
            >

                <span></span>
                <span></span>
                <span></span>

            </button>

        </div>

    </header>


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside
        id="sidebar"
        class="sidebar"
        aria-label="Worker dashboard navigation"
    >

        <!-- =================================================
             SIDEBAR HEADER
        ================================================== -->

        <div class="sidebar-header">

            <!-- =================================================
                 SKILLCONNECT WORKER PORTAL BRAND
            ================================================== -->

            <div class="sidebar-brand">

                <span class="sidebar-brand-icon">
                    SC
                </span>

                <div class="sidebar-brand-text">

                    <strong>
                        SkillConnect
                    </strong>

                    <small>
                        Worker Portal
                    </small>

                </div>

            </div>


            <!-- =================================================
                 MOBILE CLOSE BUTTON
            ================================================== -->

            <button
                type="button"
                id="closeMenuBtn"
                class="close-menu-btn"
                aria-label="Close navigation menu"
            >
                ×
            </button>

        </div>


        <!-- =================================================
             SIDEBAR NAVIGATION
        ================================================== -->

        <nav class="sidebar-nav">

            <!-- =================================================
                 DASHBOARD
            ================================================== -->

            <button
                type="button"
                id="dashboardBtn"
                class="nav-link"
            >

                <span
                    class="nav-icon"
                    aria-hidden="true"
                >
                    🏠
                </span>

                <span>
                    Dashboard
                </span>

            </button>


            <!-- =================================================
                 VIEW SERVICES
            ================================================== -->

            <button
                type="button"
                id="viewServicesBtn"
                class="nav-link active"
            >

                <span
                    class="nav-icon"
                    aria-hidden="true"
                >
                    🛠️
                </span>

                <span>
                    View Services
                </span>

            </button>


            <!-- =================================================
                 EDIT PROFILE
            ================================================== -->

            <button
                type="button"
                id="editProfileBtn"
                class="nav-link"
            >

                <span
                    class="nav-icon"
                    aria-hidden="true"
                >
                    ✏️
                </span>

                <span>
                    Edit Profile
                </span>

            </button>

        </nav>


        <!-- =================================================
             SIDEBAR FOOTER
        ================================================== -->

        <div class="sidebar-footer">

            <!-- =================================================
                 LOGOUT
            ================================================== -->

            <button
                type="button"
                id="logoutBtn"
                class="nav-link logout-link"
            >

                <span
                    class="nav-icon"
                    aria-hidden="true"
                >
                    ↪
                </span>

                <span>
                    Logout
                </span>

            </button>

        </div>

    </aside>


    <!-- =====================================================
         MOBILE SIDEBAR OVERLAY
    ====================================================== -->

    <div
        id="overlay"
        class="overlay"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         MAIN SERVICES PAGE
    ====================================================== -->

    <main
        class="dashboard"
        id="servicesPage"
    >

        <!-- =================================================
             PAGE HEADER
        ================================================== -->

        <section class="dashboard-header">

            <div>

                <h1>
                    My Services
                </h1>

                <p class="page-description">
                    Manage the services you offer to clients.
                </p>

            </div>


            <!-- =================================================
                 ADD A SERVICE BUTTON
            ================================================== -->

            <button
                type="button"
                id="addServiceBtn"
                class="add-service-btn"
            >
                Add A Service
            </button>

        </section>


        <!-- =====================================================
             SERVICES SECTION
        ====================================================== -->

        <section class="dashboard-section">

            <div class="section-heading">

                <h2>
                    Your Services
                </h2>

            </div>


            <!-- =================================================
                 SERVICES LOADING STATE

                 This is displayed while the frontend is
                 waiting for the backend services request.
            ================================================== -->

            <div
                id="servicesLoading"
                class="services-loading"
                hidden
            >

                <div
                    class="loading-spinner"
                    aria-hidden="true"
                ></div>

                <p>
                    Loading your services...
                </p>

            </div>


            <!-- =================================================
                 SERVICES CONTAINER

                 Service cards will be inserted here
                 dynamically by script.js.
            ================================================== -->

            <div
                id="servicesContainer"
                class="services-container"
            ></div>


            <!-- =================================================
                 EMPTY SERVICES MESSAGE

                 This is displayed when the backend returns
                 services as null or no services.
            ================================================== -->

            <div
                id="servicesEmpty"
                class="services-empty"
                hidden
            >

                <div
                    class="empty-icon"
                    aria-hidden="true"
                >
                    🛠️
                </div>

                <h3>
                    No Services Yet
                </h3>

                <p>
                    Your services will be shown here
                </p>

            </div>

        </section>

    </main>


    <!-- =====================================================
         NOTIFICATION MODAL

         Styled to match the Worker Dashboard modal.
    ====================================================== -->

    <div
        id="notificationOverlay"
        class="notification-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="notificationTitle"
        aria-describedby="notificationText"
        hidden
    >

        <div
            id="notificationCard"
            class="notification-card"
        >

            <!-- =================================================
                 MODAL CLOSE BUTTON
            ================================================== -->

            <button
                type="button"
                id="notificationCancelButton"
                class="notification-close-button"
                aria-label="Close notification"
            >
                ×
            </button>


            <!-- =================================================
                 MODAL ICON
            ================================================== -->

            <div
                id="notificationIcon"
                class="notification-icon"
                aria-hidden="true"
            >
                ✓
            </div>


            <!-- =================================================
                 MODAL TITLE
            ================================================== -->

            <h2 id="notificationTitle">
                Notification
            </h2>


            <!-- =================================================
                 MODAL MESSAGE
            ================================================== -->

            <p id="notificationText"></p>


            <!-- =================================================
                 MODAL ACTIONS
            ================================================== -->

            <div class="notification-actions">

                <button
                    type="button"
                    id="notificationButton"
                >
                    Continue
                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         GLOBAL CONFIGURATION
    ====================================================== -->

    <script src="../config.js"></script>


    <!-- =====================================================
         VIEW SERVICES JAVASCRIPT
    ====================================================== -->

    <script
        src="script.js"
        defer
    ></script>

</body>

</html>
