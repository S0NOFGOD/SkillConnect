<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
         BASIC DOCUMENT CONFIGURATION
    ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Worker Dashboard | SkillConnect
    </title>


    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         DASHBOARD STYLES
    ====================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =====================================================
         BACKGROUND EFFECTS
    ====================================================== -->

    <div
        class="green-glow"
        aria-hidden="true"
    ></div>

    <div
        class="blue-glow"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         TOP NAVIGATION BAR
    ====================================================== -->

    <header class="topbar">

        <div class="topbar-inner">

            <a
                href="index.html"
                class="logo"
            >
                SkillConnect
            </a>


            <button
                type="button"
                id="menuBtn"
                class="menu-btn"
                aria-label="Open navigation menu"
                aria-controls="sidebar"
                aria-expanded="false"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>

    </header>


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside
        id="sidebar"
        class="sidebar"
        aria-label="Worker dashboard navigation"
    >

        <!-- =================================================
             SIDEBAR HEADER
        ================================================== -->

        <div class="sidebar-header">

            <button
                type="button"
                id="closeMenuBtn"
                class="close-menu-btn"
                aria-label="Close navigation menu"
            >
                ×
            </button>

        </div>


        <!-- =================================================
             SIDEBAR NAVIGATION
        ================================================== -->

        <nav class="sidebar-nav">

            <!-- Dashboard -->

            <a
                href="index.html"
                class="nav-link active"
            >

                <span
                    class="nav-icon"
                    aria-hidden="true"
                >
                    🏠
                </span>

                <span>
                    Dashboard
                </span>

            </a>


            <!-- =================================================
                 VIEW SERVICES
            ================================================== -->

            <button
                type="button"
                id="viewServicesBtn"
                class="nav-link verify-profile-link"
            >

                <span
                    class="nav-icon"
                    aria-hidden="true"
                >
                    ✓
                </span>

                <span>
                    View Services
                </span>

            </button>


            <!-- =================================================
                 EDIT PROFILE
            ================================================== -->

            <button
                type="button"
                id="editProfileBtn"
                class="nav-link"
            >

                <span
                    class="nav-icon"
                    aria-hidden="true"
                >
                    ✏️
                </span>

                <span>
                    Edit Profile
                </span>

            </button>

        </nav>


        <!-- =====================================================
             SIDEBAR FOOTER
        ====================================================== -->

        <div class="sidebar-footer">

            <!-- Logout -->

            <button
                type="button"
                id="logoutBtn"
                class="nav-link logout-link"
            >

                <span
                    class="nav-icon"
                    aria-hidden="true"
                >
                    ↪
                </span>

                <span>
                    Logout
                </span>

            </button>

        </div>

    </aside>


    <!-- =====================================================
         MOBILE SIDEBAR OVERLAY
    ====================================================== -->

    <div
        id="overlay"
        class="overlay"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         MAIN DASHBOARD
    ====================================================== -->

    <main
        class="dashboard"
        id="dashboardContent"
    >

        <!-- =================================================
             DASHBOARD HEADER
        ================================================== -->

        <section class="dashboard-header">

            <div>

                <h1>
                    Welcome,
                    <span id="workerFirstName">
                        Worker
                    </span>
                </h1>

            </div>


            <!-- =================================================
                 PROFILE VERIFICATION BUTTON
            ================================================== -->

            <button
                type="button"
                id="verificationActionBtn"
                class="verification-action-btn"
            >
                Verify Profile
            </button>

        </section>


        <!-- =====================================================
             PERSONAL INFORMATION
        ====================================================== -->

        <section class="dashboard-section">

            <div class="profile-photo-card">

                <div class="profile-photo-wrapper">

                    <img
                        id="profilePhoto"
                        class="profile-photo"
                        src=""
                        alt="Worker profile photo"
                        hidden
                    >

                    <div
                        id="profilePhotoPlaceholder"
                        class="profile-photo-placeholder"
                        aria-hidden="true"
                    >
                        👤
                    </div>

                </div>

            </div>

            <div class="section-heading">

                <h2>
                    Personal Information
                </h2>

            </div>


            <div class="information-grid">

                <div class="information-card">

                    <span class="information-label">
                        Full Name
                    </span>

                    <strong id="fullName">
                        —
                    </strong>

                </div>


                <div class="information-card">

                    <span class="information-label">
                        Phone Number
                    </span>

                    <strong id="phoneNumber">
                        —
                    </strong>

                </div>

            </div>

        </section>


        <!-- =====================================================
             LOCATION INFORMATION
        ====================================================== -->

        <section class="dashboard-section">

            <div class="section-heading">

                <h2>
                    Location
                </h2>

            </div>


            <div class="information-grid">

                <div class="information-card">

                    <span class="information-label">
                        Country
                    </span>

                    <strong id="country">
                        —
                    </strong>

                </div>


                <div class="information-card">

                    <span class="information-label">
                        State
                    </span>

                    <strong id="state">
                        —
                    </strong>

                </div>


                <div class="information-card">

                    <span class="information-label">
                        City
                    </span>

                    <strong id="city">
                        —
                    </strong>

                </div>


                <div class="information-card">

                    <span class="information-label">
                        LGA
                    </span>

                    <strong id="lga">
                        —
                    </strong>

                </div>

            </div>

        </section>


        <!-- =====================================================
             PROFESSIONAL INFORMATION
        ====================================================== -->

        <section class="dashboard-section">

            <div class="section-heading">

                <h2>
                    Professional Information
                </h2>

            </div>


            <div class="information-grid">

                <div class="information-card">

                    <span class="information-label">
                        Total Skills
                    </span>

                    <strong id="totalSkills">
                        —
                    </strong>

                </div>


                <div class="information-card">

                    <span class="information-label">
                        Verification
                    </span>

                    <strong id="phoneVerification">
                        —
                    </strong>

                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         NOTIFICATION MODAL

         All dashboard errors, confirmations,
         success messages and authentication
         messages will use this modal.
    ====================================================== -->

    <div
        id="notificationOverlay"
        class="notification-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="notificationTitle"
        aria-describedby="notificationText"
        hidden
    >

        <div
            id="notificationCard"
            class="notification-card"
        >

            <!-- =================================================
                 MODAL CLOSE BUTTON
            ================================================== -->

            <button
                type="button"
                id="notificationCancelButton"
                class="notification-close-button"
                aria-label="Close notification"
            >
                ×
            </button>


            <!-- =================================================
                 MODAL ICON
            ================================================== -->

            <div
                id="notificationIcon"
                class="notification-icon"
                aria-hidden="true"
            >
                ✓
            </div>


            <!-- =================================================
                 MODAL TITLE
            ================================================== -->

            <h2 id="notificationTitle">
                Notification
            </h2>


            <!-- =================================================
                 MODAL MESSAGE
            ================================================== -->

            <p id="notificationText"></p>


            <!-- =================================================
                 MODAL ACTIONS
            ================================================== -->

            <div class="notification-actions">

                <button
                    type="button"
                    id="notificationButton"
                >
                    Continue
                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         GLOBAL CONFIGURATION
    ====================================================== -->

    <script src="../config.js"></script>


    <!-- =====================================================
         DASHBOARD JAVASCRIPT
    ====================================================== -->

    <script
        src="script.js"
        defer
    ></script>

</body>

</html>
