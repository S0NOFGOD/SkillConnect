<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
         BASIC DOCUMENT CONFIGURATION
    ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Worker Details | SkillConnect</title>


    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         PAGE STYLESHEET
    ====================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =========================================================
     BACKGROUND GLOWS
========================================================= -->

<div
    class="green-glow"
    aria-hidden="true"
></div>

<div
    class="blue-glow"
    aria-hidden="true"
></div>



<!-- =========================================================
     WORKER DETAILS HEADER
========================================================= -->

<header class="details-header">

    <div class="details-header-inner">


        <!-- =================================================
             BACK BUTTON
        ================================================== -->

        <button
            type="button"
            id="backButton"
            class="back-button"
        >

            <span
                class="back-icon"
                aria-hidden="true"
            >
                ←
            </span>

            <span>
                Back
            </span>

        </button>



        <!-- =================================================
             VERIFIED BADGE

             JavaScript displays this when the worker
             is verified.
        ================================================== -->

        <div
            class="verified-badge"
            id="verifiedBadge"
            aria-label="Verified worker"
            hidden
        >

            <span
                class="verified-icon"
                aria-hidden="true"
            >
                ✓
            </span>

            <span>
                Verified
            </span>

        </div>

    </div>

</header>



<!-- =========================================================
     MAIN WORKER DETAILS
========================================================= -->

<main class="worker-details-page">

    <div id="workerContent">


        <!-- =================================================
             PORTFOLIO
        ================================================== -->

        <section
            class="portfolio-section"
            aria-label="Worker portfolio"
        >

            <div
                id="portfolioImages"
                class="portfolio-images"
            >

                <!-- Portfolio images inserted by JavaScript -->

            </div>

        </section>



        <!-- =================================================
             WORKER INFORMATION
        ================================================== -->

        <section class="worker-info-section">


            <!-- =============================================
                 ABOUT
            ============================================== -->

            <div class="about-block">

                <h2>
                    About
                </h2>

                <p id="workerDescription">
                    —
                </p>

            </div>



            <!-- =============================================
                 WORKER INFORMATION GRID
            ============================================== -->

            <div class="worker-info-grid">


                <!-- =========================================
                     PRIMARY SKILL
                ========================================== -->

                <div class="info-item">

                    <span class="info-label">
                        Primary Skill
                    </span>

                    <strong id="workerSkill">
                        —
                    </strong>

                </div>



                <!-- =========================================
                     EXPERIENCE
                ========================================== -->

                <div class="info-item">

                    <span class="info-label">
                        Experience
                    </span>

                    <strong id="workerExperience">
                        —
                    </strong>

                </div>



                <!-- =========================================
                     STARTING PRICE
                ========================================== -->

                <div class="info-item">

                    <span class="info-label">
                        Starting Price
                    </span>

                    <strong
                        id="workerPrice"
                        class="price-value"
                    >
                        —
                    </strong>

                </div>



                <!-- =========================================
                     LOCATION
                ========================================== -->

                <div class="info-item">

                    <span class="info-label">
                        Location
                    </span>

                    <strong id="workerLocation">
                        —
                    </strong>

                </div>

            </div>

        </section>



        <!-- =================================================
             RATING AND REVIEWS
        ================================================== -->

        <section class="reviews-section">


            <!-- =============================================
                 SECTION HEADER
            ============================================== -->

            <div class="reviews-header">

                <div>

                    <h2>
                        Rating and reviews
                    </h2>

                    <p>
                        See what clients say about this worker.
                    </p>

                </div>

            </div>



            <!-- =============================================
                 RATING SUMMARY
            ============================================== -->

            <div class="rating-summary">


                <!-- =========================================
                     RATING VALUE
                ========================================== -->

                <div class="rating-value">

                    <strong id="workerRating">
                        —
                    </strong>

                    <div
                        id="ratingStars"
                        class="rating-stars"
                        aria-label="Worker rating"
                    >
                        ★★★★★
                    </div>

                    <span id="reviewCount">
                        No reviews yet
                    </span>

                </div>



                <!-- =========================================
                     REVIEWS LIST
                ========================================== -->

                <div
                    id="reviewsList"
                    class="reviews-list"
                >

                    <!-- Reviews inserted by JavaScript -->

                </div>

            </div>

        </section>

    </div>

</main>



<!-- =========================================================
     FIXED WORKER ACTION BAR
========================================================= -->

<div class="worker-action-bar">


    <!-- =====================================================
         CONTACT WORKER
    ====================================================== -->

    <a
        href="#"
        id="contactWorkerButton"
        class="worker-action-button contact-worker-button"
        aria-label="Contact worker"
    >

        <span
            class="action-icon"
            aria-hidden="true"
        >
            ☎
        </span>

        <span>
            Contact Worker
        </span>

    </a>



    <!-- =====================================================
         RATE WORKER
    ====================================================== -->

    <a
        href="#"
        id="rateWorkerButton"
        class="worker-action-button rate-worker-button"
        aria-label="Rate worker"
    >

        <span
            class="action-icon"
            aria-hidden="true"
        >
            ★
        </span>

        <span>
            Rate Worker
        </span>

    </a>

</div>



<!-- =========================================================
     NOTIFICATION MODAL
========================================================= -->

<div
    id="notificationOverlay"
    class="notification-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="notificationTitle"
    aria-describedby="notificationText"
    hidden
>

    <div
        id="notificationCard"
        class="notification-card"
    >


        <!-- =================================================
             MODAL ICON
        ================================================== -->

        <div
            id="notificationIcon"
            class="notification-icon"
            aria-hidden="true"
        >
            ✓
        </div>



        <!-- =================================================
             MODAL TITLE
        ================================================== -->

        <h2 id="notificationTitle"></h2>



        <!-- =================================================
             MODAL MESSAGE
        ================================================== -->

        <p id="notificationText"></p>



        <!-- =================================================
             MODAL ACTION
        ================================================== -->

        <div class="notification-actions">

            <button
                type="button"
                id="notificationButton"
            >
                Continue
            </button>

        </div>

    </div>

</div>



<!-- =========================================================
     FRONTEND API CONFIGURATION
========================================================= -->

<script src="../config.js"></script>



<!-- =========================================================
     PAGE JAVASCRIPT
========================================================= -->

<script src="script.js"></script>


</body>

</html>
