<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Client Dashboard | SkillConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body><div class="blue-glow" aria-hidden="true"></div>
<div class="green-glow" aria-hidden="true"></div><header class="topbar">
<div class="topbar-inner">
<a href="index.html" class="logo">SkillConnect</a>
<button type="button" id="menuBtn" class="menu-btn" aria-label="Open navigation menu" aria-controls="sidebar" aria-expanded="false">
<span></span><span></span><span></span>
</button>
</div>
</header><aside id="sidebar" class="sidebar" aria-label="Client dashboard navigation"><div class="sidebar-header">
<div class="sidebar-brand">
<span class="sidebar-brand-icon">SC</span>
<div class="sidebar-brand-text">
<strong>SkillConnect</strong>
<small>Client Portal</small>
</div>
</div>
<button type="button" id="closeMenuBtn" class="close-menu-btn" aria-label="Close navigation menu">×</button>
</div><nav class="sidebar-nav"><a href="index.html" class="nav-link active">
<span class="nav-icon" aria-hidden="true">🏠</span>
<span>Dashboard</span>
</a><button type="button" id="findWorkersBtn" class="nav-link">
<span class="nav-icon" aria-hidden="true">🔎</span>
<span>Find Workers</span>
</button><button type="button" id="editProfileBtn" class="nav-link">
<span class="nav-icon" aria-hidden="true">✏️</span>
<span>Edit Profile</span>
</button></nav><div class="sidebar-footer">
<button type="button" id="logoutBtn" class="nav-link logout-link">
<span class="nav-icon" aria-hidden="true">↪</span>
<span>Logout</span>
</button>
</div></aside><div id="overlay" class="overlay" aria-hidden="true"></div><main class="dashboard" id="dashboardContent"><section class="dashboard-header">
<div class="welcome-content">
<span class="dashboard-eyebrow">CLIENT DASHBOARD</span>
<h1>Welcome, <span id="clientFirstName">Client</span></h1>
</div>
</section><section class="dashboard-section"><div class="profile-photo-card">
<div class="profile-photo-wrapper">
<img id="profilePhoto" class="profile-photo" src="" alt="Client profile photo" hidden>
<div id="profilePhotoPlaceholder" class="profile-photo-placeholder" aria-hidden="true">👤</div>
</div>
</div><div class="section-heading">
<h2>Personal Information</h2>
</div><div class="information-grid"><div class="information-card">
<span class="information-label">Full Name</span>
<strong id="fullName">—</strong>
</div><div class="information-card">
<span class="information-label">Phone Number</span>
<strong id="phoneNumber">—</strong>
</div></div></section><section class="dashboard-section"><div class="section-heading">
<h2>Location</h2>
</div><div class="information-grid"><div class="information-card">
<span class="information-label">Country</span>
<strong id="country">—</strong>
</div><div class="information-card">
<span class="information-label">State</span>
<strong id="state">—</strong>
</div><div class="information-card">
<span class="information-label">City</span>
<strong id="city">—</strong>
</div><div class="information-card">
<span class="information-label">LGA</span>
<strong id="lga">—</strong>
</div></div></section></main><div id="notificationOverlay" class="notification-modal" role="dialog" aria-modal="true" aria-labelledby="notificationTitle" aria-describedby="notificationText" hidden><div id="notificationCard" class="notification-card">

<div id="notificationIcon" class="notification-icon" aria-hidden="true">✓</div><h2 id="notificationTitle">Notification</h2><p id="notificationText"></p><div class="notification-actions">
<button type="button" id="notificationCancelButton" class="notification-close-button" aria-label="Close notification">×</button>
<button type="button" id="notificationButton">Continue</button>
</div></div></div><script src="../config.js"></script><script src="script.js" defer></script></body>
</html>
