<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
         BASIC DOCUMENT CONFIGURATION
    ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Find Skilled Workers | SkillConnect</title>


    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         PAGE STYLESHEET
    ====================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =========================================================
     BACKGROUND GLOWS
========================================================= -->

<div
    class="green-glow"
    aria-hidden="true"
></div>

<div
    class="blue-glow"
    aria-hidden="true"
></div>



<!-- =========================================================
     TOP NAVBAR
     
     Mobile:
         Logo + hamburger menu

     Desktop:
         Logo remains visible while sidebar is displayed.
========================================================= -->

<header class="topbar">

    <div class="topbar-inner">

        <a
            href="../index.html"
            class="logo"
        >
            Client Dashboard
        </a>


        <!-- =================================================
             MOBILE HAMBURGER
        ================================================== -->

        <button
            type="button"
            id="menuBtn"
            class="menu-btn"
            aria-label="Open navigation menu"
            aria-controls="sidebar"
            aria-expanded="false"
        >

            <span></span>
            <span></span>
            <span></span>

        </button>

    </div>

</header>



<!-- =========================================================
     CLIENT SIDEBAR
========================================================= -->

<aside
    id="sidebar"
    class="sidebar"
    aria-label="Client navigation"
>


    <!-- =====================================================
         SIDEBAR HEADER
    ====================================================== -->

    <div class="sidebar-header">

        <button
            type="button"
            id="closeMenuBtn"
            class="close-menu-btn"
            aria-label="Close navigation menu"
        >
            ×
        </button>

    </div>



    <!-- =====================================================
         CLIENT NAVIGATION
    ====================================================== -->

    <nav class="sidebar-nav">


        <!-- =================================================
             FIND WORKERS
        ================================================== -->

        <a
            href="index.html"
            class="nav-link active"
        >

            <span class="nav-icon">🔎</span>

            <span>Find Workers</span>

        </a>


        <!-- =================================================
             BOOKING HISTORY

             According to the requested flow this redirects
             to client-worker-contact-details.
        ================================================== -->

        <a
            href="../client-worker-contact-details/index.html"
            class="nav-link"
        >

            <span class="nav-icon">📋</span>

            <span>Booking History</span>

        </a>


        <!-- =================================================
             PROFILE SETTINGS
        ================================================== -->

        <a
            href="../client-profile-settings/index.html"
            class="nav-link"
        >

            <span class="nav-icon">⚙️</span>

            <span>Profile Settings</span>

        </a>

    </nav>



    <!-- =====================================================
         SIDEBAR FOOTER
    ====================================================== -->

    <div class="sidebar-footer">

        <button
            type="button"
            id="logoutBtn"
            class="nav-link logout-link"
        >

            <span class="nav-icon">↪</span>

            <span>Logout</span>

        </button>

    </div>

</aside>



<!-- =========================================================
     SIDEBAR OVERLAY
========================================================= -->

<div
    id="overlay"
    class="overlay"
    aria-hidden="true"
></div>



<!-- =========================================================
     MAIN CLIENT WORKER SEARCH
========================================================= -->

<main class="dashboard">


    <!-- =====================================================
         SEARCH AND FILTER SECTION
         
         JavaScript can make this section fixed when the
         client scrolls to it.
    ====================================================== -->

    <section
        id="searchFilterSection"
        class="search-filter-section"
    >


        <!-- =================================================
             SEARCH
             
             Searches worker name and skill.
        ================================================== -->

        <div class="search-wrapper">

            <label
                for="searchInput"
                class="sr-only"
            >
                Search workers
            </label>


            <span
                class="search-icon"
                aria-hidden="true"
            >
                🔎
            </span>


            <input
                type="search"
                id="searchInput"
                name="search"
                placeholder="Search by name or skill..."
                autocomplete="off"
            >

        </div>



        <!-- =================================================
             FILTERS
        ================================================== -->

        <div class="filters">


            <!-- =================================================
                 SKILL FILTER
            ================================================== -->

            <div class="filter-group">

                <label for="categoryFilter">
                    Skill
                </label>


                <select
                    id="categoryFilter"
                    name="category"
                >

                    <option value="">
                        All Skills
                    </option>

                    <option value="Electrician">
                        Electrician
                    </option>

                    <option value="Plumber">
                        Plumber
                    </option>

                    <option value="Carpenter">
                        Carpenter
                    </option>

                    <option value="Painter">
                        Painter
                    </option>

                    <option value="Welder">
                        Welder
                    </option>

                </select>

            </div>



            <!-- =================================================
                 PRICE FILTER
            ================================================== -->

            <div class="filter-group">

                <label for="priceFilter">
                    Price
                </label>


                <select
                    id="priceFilter"
                    name="price"
                >

                    <option value="">
                        All Price
                    </option>

                    <option value="1000">
                        ₦1,000
                    </option>

                    <option value="2000">
                        ₦2,000
                    </option>

                    <option value="3000">
                        ₦3,000
                    </option>

                    <option value="4000">
                        ₦4,000
                    </option>

                    <option value="5000">
                        ₦5,000+
                    </option>

                </select>

            </div>

        </div>

    </section>



    <!-- =====================================================
         RESULTS HEADER
    ====================================================== -->

    <section class="results-header">

        <div>

            <h2>
                Available Workers
            </h2>


            <p id="resultsText">
                Find skilled workers near you.
            </p>

        </div>

    </section>



    <!-- =====================================================
         WORKER LIST
         
         JavaScript dynamically creates worker cards.

         Each card will contain only:
         
         1. Profile picture
         2. Worker name
         3. City and state
         4. Price
         5. View Profile button
    ====================================================== -->

    <section
        id="workerList"
        class="worker-list"
        aria-live="polite"
        aria-label="Available skilled workers"
    >

        <!-- Worker cards are inserted by script.js -->

    </section>



    <!-- =====================================================
         EMPTY RESULTS STATE
         
         Displayed when search/filter produces no workers.
    ====================================================== -->

    <section
        id="emptyState"
        class="empty-state"
        hidden
    >

        <div
            class="empty-icon"
            aria-hidden="true"
        >
            🔎
        </div>


        <h2>
            No Workers Found
        </h2>


        <p id="emptyStateText">
            Try changing your search or filter options.
        </p>

    </section>
    

</main>



<!-- =========================================================
     NOTIFICATION MODAL
     
     Used for:
     
     1. Authentication errors
     2. Account errors
     3. Search errors
     4. Success messages
     5. Redirect messages
     6. Logout confirmation
     
     JavaScript controls the modal buttons.
========================================================= -->

<div
    id="notificationOverlay"
    class="notification-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="notificationTitle"
    aria-describedby="notificationText"
    hidden
>

    <div class="notification-card">


        <!-- =================================================
             MODAL ICON
        ================================================== -->

        <div
            id="notificationIcon"
            class="notification-icon"
            aria-hidden="true"
        >
            ✓
        </div>


        <!-- =================================================
             MODAL TITLE
        ================================================== -->

        <h2 id="notificationTitle"></h2>


        <!-- =================================================
             MODAL MESSAGE
        ================================================== -->

        <p id="notificationText"></p>


        <!-- =================================================
             MODAL ACTIONS
             
             JavaScript controls which buttons are visible.
             
             Normal error/success:
                 Close
             
             Redirect:
                 Continue
             
             Logout confirmation:
                 Cancel + Logout
        ================================================== -->

        <div
            id="notificationActions"
            class="notification-actions"
        >

            <button
                type="button"
                id="notificationCancelButton"
                class="notification-cancel-button"
                hidden
            >
                Cancel
            </button>


            <button
                type="button"
                id="notificationButton"
            >
                Continue
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     PAGE JAVASCRIPT
========================================================= -->
<script src="../config.js"></script>
<script src="script.js"></script>


</body>

</html>
